name: Deploy Backend Oracle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/EduFlow.Api/**"
      - "src/EduFlow.Application/**"
      - "src/EduFlow.Domain/**"
      - "src/EduFlow.Infrastructure/**"
      - "src/EduFlow.Analytics/**"
      - "src/EduFlow.Workers/**"
      - "docker/**"
      - "docker-compose.pilot.yml"
      - "deploy/Caddyfile"
      - ".github/workflows/deploy-backend-oracle.yml"

concurrency:
  group: deploy-backend-oracle
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy backend
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_PORT: ${{ secrets.ORACLE_PORT }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_APP_DIR: ${{ secrets.ORACLE_APP_DIR }}
      API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore EduFlow.sln

      - name: Build
        run: dotnet build EduFlow.sln -c Release --no-restore

      - name: Publish API
        run: dotnet publish src/EduFlow.Api/EduFlow.Api.csproj -c Release --no-restore -o artifacts/publish/api

      - name: Publish Workers
        run: dotnet publish src/EduFlow.Workers/EduFlow.Workers.csproj -c Release --no-restore -o artifacts/publish/workers

      - name: Pack publish artifacts
        run: |
          tar -czf api-publish.tgz -C artifacts/publish/api .
          tar -czf workers-publish.tgz -C artifacts/publish/workers .

      - name: Configure SSH
        run: |
          set -euo pipefail
          test -n "${{ secrets.ORACLE_SSH_KEY }}" || (echo "Missing secret ORACLE_SSH_KEY" && exit 1)

          echo "DEPLOY_HOST=${ORACLE_HOST:-163.176.225.154}" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=${ORACLE_PORT:-22}" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=${ORACLE_USER:-ubuntu}" >> "$GITHUB_ENV"
          echo "DEPLOY_APP_DIR=${ORACLE_APP_DIR:-/home/ubuntu/EduFlow}" >> "$GITHUB_ENV"
          echo "DEPLOY_HEALTH_URL=${API_HEALTH_URL:-https://edu-flow-api.duckdns.org/health/live}" >> "$GITHUB_ENV"

          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -p "${ORACLE_PORT:-22}" "${ORACLE_HOST:-163.176.225.154}" >> ~/.ssh/known_hosts

      - name: Upload artifacts to Oracle
        run: |
          set -euo pipefail
          scp -P "$DEPLOY_PORT" -i ~/.ssh/oracle_key api-publish.tgz "$DEPLOY_USER@$DEPLOY_HOST:~/api-publish.tgz"
          scp -P "$DEPLOY_PORT" -i ~/.ssh/oracle_key workers-publish.tgz "$DEPLOY_USER@$DEPLOY_HOST:~/workers-publish.tgz"

      - name: Deploy containers
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/oracle_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -euo pipefail
            cd '$DEPLOY_APP_DIR'
            git fetch origin main
            git reset --hard origin/main
            rm -rf artifacts/publish/api artifacts/publish/workers
            mkdir -p artifacts/publish/api artifacts/publish/workers
            tar -xzf ~/api-publish.tgz -C artifacts/publish/api
            tar -xzf ~/workers-publish.tgz -C artifacts/publish/workers
            test -f artifacts/publish/api/EduFlow.Api.dll
            test -f artifacts/publish/workers/EduFlow.Workers.dll
            docker build --no-cache -f docker/Dockerfile.api.runtime -t eduflow-pilot-api:latest .
            docker build --no-cache -f docker/Dockerfile.workers.runtime -t eduflow-pilot-workers:latest .
            export EDUFLOW_ENV_FILE=deploy/.env.production
            docker compose -f docker-compose.pilot.yml --env-file deploy/.env.production up -d rabbitmq api workers caddy --no-build
            docker compose -f docker-compose.pilot.yml --env-file deploy/.env.production ps
          "

      - name: Validate health
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/oracle_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -euo pipefail
            cd '$DEPLOY_APP_DIR'
            for attempt in \$(seq 1 18); do
              if docker inspect --format='{{json .State.Health.Status}}' eduflow-pilot-api | grep -q healthy; then
                break
              fi
              sleep 5
            done
            docker inspect --format='{{json .State.Health.Status}}' eduflow-pilot-api | grep -q healthy
            curl -kfsS '$DEPLOY_HEALTH_URL'
            docker compose -f docker-compose.pilot.yml --env-file deploy/.env.production logs --tail=80 api
            docker compose -f docker-compose.pilot.yml --env-file deploy/.env.production logs --tail=60 workers
          "
