name: Deploy Backend Oracle

on:
  workflow_dispatch:
    inputs:
      deploy_rabbitmq:
        description: "Deploy RabbitMQ VM"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      deploy_api:
        description: "Deploy API VM"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      deploy_workers:
        description: "Deploy Workers VM"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: deploy-backend-oracle
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy backend
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
      ORACLE_PORT: ${{ secrets.ORACLE_PORT }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_APP_DIR: ${{ secrets.ORACLE_APP_DIR }}
      ORACLE_API_HOST: ${{ secrets.ORACLE_API_HOST }}
      ORACLE_WORKERS_HOST: ${{ secrets.ORACLE_WORKERS_HOST }}
      ORACLE_RABBITMQ_HOST: ${{ secrets.ORACLE_RABBITMQ_HOST }}
      API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore EduFlow.sln

      - name: Build
        run: dotnet build EduFlow.sln -c Release --no-restore

      - name: Publish API
        run: dotnet publish src/EduFlow.Api/EduFlow.Api.csproj -c Release --no-restore -o artifacts/publish/api

      - name: Publish Workers
        run: dotnet publish src/EduFlow.Workers/EduFlow.Workers.csproj -c Release --no-restore -o artifacts/publish/workers

      - name: Pack publish artifacts
        run: |
          tar -czf api-publish.tgz -C artifacts/publish/api .
          tar -czf workers-publish.tgz -C artifacts/publish/workers .

      - name: Configure SSH
        run: |
          set -euo pipefail
          test -n "$ORACLE_SSH_KEY" || (echo "Missing secret ORACLE_SSH_KEY" && exit 1)
          test -n "$ORACLE_API_HOST" || (echo "Missing secret ORACLE_API_HOST" && exit 1)

          {
            echo "DEPLOY_PORT=${ORACLE_PORT:-22}"
            echo "DEPLOY_USER=${ORACLE_USER:-ubuntu}"
            echo "DEPLOY_APP_DIR=${ORACLE_APP_DIR:-/home/ubuntu/EduFlow}"
            echo "DEPLOY_API_HOST=$ORACLE_API_HOST"
            echo "DEPLOY_WORKERS_HOST=${ORACLE_WORKERS_HOST:-$ORACLE_API_HOST}"
            echo "DEPLOY_RABBITMQ_HOST=${ORACLE_RABBITMQ_HOST:-}"
            echo "DEPLOY_HEALTH_URL=${API_HEALTH_URL:-https://edu-flow-api.duckdns.org/health/live}"
          } >> "$GITHUB_ENV"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key

          ssh-keyscan -p "${ORACLE_PORT:-22}" "$ORACLE_API_HOST" >> ~/.ssh/known_hosts
          if [ -n "${ORACLE_WORKERS_HOST:-}" ] && [ "$ORACLE_WORKERS_HOST" != "$ORACLE_API_HOST" ]; then
            ssh-keyscan -p "${ORACLE_PORT:-22}" "$ORACLE_WORKERS_HOST" >> ~/.ssh/known_hosts
          fi
          if [ -n "${ORACLE_RABBITMQ_HOST:-}" ]; then
            ssh-keyscan -p "${ORACLE_PORT:-22}" "$ORACLE_RABBITMQ_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Deploy RabbitMQ VM
        if: ${{ inputs.deploy_rabbitmq == 'true' }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_RABBITMQ_HOST" || (echo "Missing secret ORACLE_RABBITMQ_HOST" && exit 1)
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/oracle_key "$DEPLOY_USER@$DEPLOY_RABBITMQ_HOST" "
            set -euo pipefail
            cd '$DEPLOY_APP_DIR'
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.rabbitmq.yml --env-file deploy/.env.production up -d rabbitmq
            docker compose -f docker-compose.rabbitmq.yml --env-file deploy/.env.production ps
          "

      - name: Upload API artifact
        if: ${{ inputs.deploy_api == 'true' }}
        run: |
          scp -P "$DEPLOY_PORT" -i ~/.ssh/oracle_key api-publish.tgz "$DEPLOY_USER@$DEPLOY_API_HOST:~/api-publish.tgz"

      - name: Deploy API VM
        if: ${{ inputs.deploy_api == 'true' }}
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/oracle_key "$DEPLOY_USER@$DEPLOY_API_HOST" "
            set -euo pipefail
            cd '$DEPLOY_APP_DIR'
            git fetch origin main
            git reset --hard origin/main
            rm -rf artifacts/publish/api
            mkdir -p artifacts/publish/api
            tar -xzf ~/api-publish.tgz -C artifacts/publish/api
            test -f artifacts/publish/api/EduFlow.Api.dll
            docker build --no-cache -f docker/Dockerfile.api.runtime -t eduflow-pilot-api:latest .
            export EDUFLOW_ENV_FILE=deploy/.env.production
            docker compose -f docker-compose.api.yml --env-file deploy/.env.production up -d api caddy --no-build
            docker compose -f docker-compose.api.yml --env-file deploy/.env.production ps
          "

      - name: Upload Workers artifact
        if: ${{ inputs.deploy_workers == 'true' }}
        run: |
          scp -P "$DEPLOY_PORT" -i ~/.ssh/oracle_key workers-publish.tgz "$DEPLOY_USER@$DEPLOY_WORKERS_HOST:~/workers-publish.tgz"

      - name: Deploy Workers VM
        if: ${{ inputs.deploy_workers == 'true' }}
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/oracle_key "$DEPLOY_USER@$DEPLOY_WORKERS_HOST" "
            set -euo pipefail
            cd '$DEPLOY_APP_DIR'
            git fetch origin main
            git reset --hard origin/main
            rm -rf artifacts/publish/workers
            mkdir -p artifacts/publish/workers
            tar -xzf ~/workers-publish.tgz -C artifacts/publish/workers
            test -f artifacts/publish/workers/EduFlow.Workers.dll
            docker build --no-cache -f docker/Dockerfile.workers.runtime -t eduflow-pilot-workers:latest .
            export EDUFLOW_ENV_FILE=deploy/.env.production
            docker compose -f docker-compose.workers.yml --env-file deploy/.env.production up -d workers --no-build
            docker compose -f docker-compose.workers.yml --env-file deploy/.env.production ps
          "

      - name: Validate API health
        if: ${{ inputs.deploy_api == 'true' }}
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/oracle_key "$DEPLOY_USER@$DEPLOY_API_HOST" "
            set -euo pipefail
            cd '$DEPLOY_APP_DIR'
            for attempt in \$(seq 1 18); do
              if docker inspect --format='{{json .State.Health.Status}}' eduflow-api | grep -q healthy; then
                break
              fi
              sleep 5
            done
            docker inspect --format='{{json .State.Health.Status}}' eduflow-api | grep -q healthy
            curl -kfsS '$DEPLOY_HEALTH_URL'
            docker compose -f docker-compose.api.yml --env-file deploy/.env.production logs --tail=80 api
          "
